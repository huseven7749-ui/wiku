<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WIKU 餵食日記</title>
<meta name="description" content="WIKU 每一餐吃了什麼、吃多少、食欲幾分，都記在這裡。">
<meta name="theme-color" content="#EFE8E0">
<meta property="og:type" content="website">
<meta property="og:title" content="WIKU 餵食日記">
<meta property="og:description" content="WIKU 每一餐吃了什麼、吃多少、食欲幾分">
<meta property="og:image" content="https://huseven7749-ui.github.io/wiku/og.png">
<meta property="og:url" content="https://huseven7749-ui.github.io/wiku/">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="WIKU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one phone-width column. Header with WIKU, then a card stack per tab (今天 / 紀錄 / 罐罐), bottom tab bar. */
:root {
  --outline: #8C7A6E; --dot: #E6DCD1;
  --bg: #EFE8E0;          /* lilac-grey, from the cat's coat shadow */
  --surface: #FAF6F1;     /* cat cream */
  --surface2: #EFE7DE;
  --ink: #4A3F3A;
  --ink2: #7E6F66;
  --line: #DDD2C7;
  --accent: #B3665D;      /* ear pink, strong enough for white text */
  --on-accent: #FFFFFF;
  --accent-soft: #F1DDD6;
  --stripe: #D8B48F;      /* tabby brown-grey */
  --lilac: #E1D9E4;
  --s4: #3F8F63; --s3: #7E9F3C; --s2: #C9921F; --s1: #D1692F; --s0: #BF3F3A;
  --font-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg) radial-gradient(var(--dot) 1.6px, transparent 1.7px) 0 0 / 24px 24px; color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 104px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
.top .wk { flex: none; width: 64px; height: auto; }
.top .name { font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.top .sub { color: var(--ink2); font-size: 13px; }
.sum { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; background: var(--surface); border: 1.5px solid var(--outline); font-size: 13px; color: var(--ink2); }
.pill b { color: var(--ink); font-weight: 700; }
.pill.ok { background: var(--accent-soft); border-color: transparent; color: var(--ink); }

/* cards */
.card { background: var(--surface); border: 2px solid var(--outline); box-shadow: 0 4px 0 var(--outline); border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2 { font-size: 20px; }
.card .hint { color: var(--ink2); font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.between { justify-content: space-between; }
.label { font-size: 13px; color: var(--ink2); letter-spacing: .04em; }

/* plan card */
.planhead { display: flex; align-items: flex-end; gap: 10px; }
.planhead .cat { flex: none; width: 112px; height: auto; margin-bottom: -4px; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--accent-soft); border: 2px solid var(--outline); border-radius: 20px; padding: 10px 14px; }
.bubble::before { content: ""; position: absolute; left: -9px; bottom: 18px; width: 14px; height: 14px; background: var(--accent-soft); border-left: 2px solid var(--outline); border-bottom: 2px solid var(--outline); transform: rotate(45deg); border-radius: 3px; }
.bubble .big { font-family: var(--font-display); font-size: 19px; line-height: 1.3; }
.bubble .small { font-size: 13px; color: var(--ink2); }
.steps { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface2); border-radius: 14px; padding: 10px 12px; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.tag.fridge { background: var(--lilac); }
.tag.open { background: var(--accent); color: var(--on-accent); }
.tag.keep { background: var(--surface); border: 1px dashed var(--stripe); color: var(--ink2); }
.tag.bowl { background: var(--accent-soft); color: var(--ink); border: 1.5px solid var(--s2); }
.mustbox { display: flex; flex-direction: column; gap: 8px; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; background: var(--accent-soft); border: 2px solid var(--accent); font-size: 14px; }
.mustbox b { font-weight: 700; }
.mustbox .why { font-size: 13px; color: var(--ink2); }
.mustok { font-size: 13px; color: var(--ink2); background: var(--surface2); border-radius: 12px; padding: 6px 10px; margin-bottom: 8px; }
.leftover { display: flex; flex-direction: column; gap: 8px; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface2); border: 1.5px dashed var(--stripe); font-size: 14px; }
.leftover.warn { border: 2px solid var(--s1); }
.leftover b { font-weight: 700; }
.leftover .why { display: block; font-size: 13px; color: var(--ink2); }
.leftover .alert { display: block; font-size: 13px; font-weight: 700; color: var(--ink); background: var(--accent-soft); border-radius: 10px; padding: 6px 8px; margin-top: 4px; }
.poop { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.poop .stepper { flex: 0 1 220px; }
.poopbox { background: var(--surface2); border-radius: 14px; padding: 10px 12px; }
.poopbox b#h-poop { font-size: 16px; }
.wt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wfield { background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; }
.wt input { width: 130px; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 600 18px var(--font-body); -webkit-appearance: none; appearance: none; }
.wt input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.wlist { display: flex; flex-direction: column; gap: 6px; }
.wlist div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.steps .g { font-weight: 700; }
.steps .nm { font-weight: 500; }
.steps .why { display: block; font-size: 13px; color: var(--ink2); }

.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 42px; height: 42px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); font-weight: 700; font-size: 14px; flex: none; }
.stepper button:active { background: var(--lilac); }
.stepper .val { display: flex; align-items: baseline; justify-content: center; gap: 2px; flex: 1; min-width: 64px; font-family: var(--font-display); font-size: 26px; }
.stepper input { width: 3.1ch; min-width: 56px; text-align: center; font: inherit; background: transparent; color: inherit; border: 0; border-bottom: 2px solid var(--line); padding: 0; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .u { font-size: 14px; color: var(--ink2); }

.suggest { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; border-radius: 14px; padding: 10px 12px; background: var(--surface2); border: 1px dashed var(--stripe); font-size: 14px; }
.btn { box-shadow: 0 3px 0 var(--outline); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { background: var(--surface2); color: var(--ink); border: 1.5px solid var(--outline); font-weight: 500; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--outline); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; min-height: 52px; font-size: 17px; }
.btn.danger { background: var(--s0); color: #fff; }

/* score */
.scores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.score { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface2); min-width: 0; }
.score .wk { width: 100%; max-width: 54px; height: auto; }
.score .pts { font-family: var(--font-display); font-size: 18px; line-height: 1; color: var(--sc); }
.score .t { font-size: 11px; line-height: 1.25; text-align: center; color: var(--ink2); }
.score[aria-pressed="true"] { border-color: var(--sc); background: var(--surface); box-shadow: 0 0 0 2px var(--sc) inset; }
.score[aria-pressed="true"] .t { color: var(--ink); font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface2); font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.chip.warn[aria-pressed="true"] { background: var(--s0); border-color: var(--s0); color: #fff; }
.quick { display: flex; gap: 8px; }
.quick .chip { min-height: 34px; font-size: 13px; padding: 0 12px; }

textarea, input[type="datetime-local"] { width: 100%; font: inherit; color: var(--ink); background: var(--surface2); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
textarea { min-height: 72px; resize: vertical; }
/* iPhone Safari gives date inputs a fixed native width that ignores width:100% — reset it so the box stays inside the card */
input[type="datetime-local"] { min-height: 44px; display: block; min-width: 0; max-width: 100%; box-sizing: border-box; -webkit-appearance: none; appearance: none; text-align: left; line-height: 1.4; }
input[type="datetime-local"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
input[type="datetime-local"]::-webkit-datetime-edit { padding: 0; }
.field { min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.miss { font-size: 13px; color: var(--ink2); text-align: center; }

/* mini list */
.mini { display: flex; flex-direction: column; gap: 8px; }
.mini .it { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: 14px; padding: 8px 12px; min-width: 0; }
.mini .it .tx { flex: 1; min-width: 0; font-size: 14px; }
.mini .it .tx span { display: block; font-size: 12px; color: var(--ink2); }
.mini button.it { width: 100%; text-align: left; border: 1.5px solid transparent; }
.mini button.it:active { border-color: var(--outline); }
.mini .it .chev { flex: none; font-size: 13px; color: var(--ink2); }
.badge { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 18px; color: #fff; background: var(--sc); }

/* history */
.lview { display: flex; gap: 8px; }
.hmonth summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.hmonth summary::-webkit-details-marker { display: none; }
.hmonth summary h2::after { content: " ▾"; font-size: 14px; color: var(--ink2); }
.hmonth:not([open]) summary h2::after { content: " ▸"; }
.hmsum { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.hweeks { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.hweek { background: var(--surface2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.hweek .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.hweek .hd b { font-weight: 700; }
.hcells { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.hcells i { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 40px; border-radius: 8px; font-style: normal; font-size: 11px; line-height: 1.15; background: var(--surface); border: 1px dashed var(--line); color: var(--ink2); }
.hcells i.on { background: var(--sc); border: 0; color: #fff; font-weight: 700; }
.hcells i.out { visibility: hidden; }
.hstats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink2); }
.hstats b { color: var(--ink); }
.trend { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; align-items: end; }
.trend .d { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.trend .bars { display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 64px; width: 100%; }
.trend .bars i { flex: 0 1 9px; min-width: 4px; border-radius: 3px 3px 1px 1px; background: var(--sc); }
.trend .kc { font-size: 12px; font-weight: 700; line-height: 1.2; }
.trend .dl { font-size: 11px; color: var(--ink2); line-height: 1.2; white-space: nowrap; }
.trend .d.today .dl { color: var(--accent); font-weight: 700; }
.day { display: flex; flex-direction: column; gap: 10px; }
.dayh { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dayh h3 { font-size: 18px; }
.dayh .meta { color: var(--ink2); font-size: 13px; }
.meal { display: flex; flex-direction: column; gap: 6px; background: var(--surface2); border-radius: 16px; padding: 12px; min-width: 0; }
.meal .l1 { display: flex; align-items: center; gap: 10px; }
.meal .ttl { flex: 1; min-width: 0; }
.meal .ttl b { font-weight: 700; }
.meal .tm { flex: none; font-size: 17px; font-weight: 700; color: var(--ink); background: var(--accent-soft); border-radius: 10px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
.meal .ttl span { display: block; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
.meal .note { font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
.meal .acts { display: flex; gap: 8px; justify-content: flex-end; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; }
.tagrow .t2 { font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--lilac); }
.tagrow .t2.warn { background: var(--s0); color: #fff; }
.copybox { width: 100%; }
.dayimg { display: block; width: 100%; height: auto; border-radius: 16px; border: 1px solid var(--line); }
.empty { text-align: center; color: var(--ink2); padding: 20px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .wk { width: 130px; height: auto; }

/* cans */
.can { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; background: var(--surface2); border-radius: 16px; padding: 10px 12px; border: 2px solid transparent; min-width: 0; }
.can .no { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--lilac); font-family: var(--font-display); font-size: 20px; }
.can.now { border-color: var(--accent); background: var(--surface); }
.can.now .no { background: var(--accent); color: var(--on-accent); }
.can.done .no { background: var(--s4); color: #fff; }
.can .nm { font-weight: 700; overflow-wrap: anywhere; }
.can .nm span { font-weight: 400; color: var(--ink2); font-size: 13px; display: block; }
.can .st { font-size: 12px; color: var(--ink2); font-weight: 400; margin-top: 2px; }
.can .gw { display: flex; align-items: baseline; gap: 2px; justify-content: flex-end; }
.can .gw input { width: 3.2ch; min-width: 46px; text-align: right; font: inherit; font-weight: 700; color: inherit; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 6px; -moz-appearance: textfield; }
.can .gw input::-webkit-outer-spin-button, .can .gw input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
details.more { margin-top: 4px; }
details.more summary { cursor: pointer; list-style: none; font-size: 12px; color: var(--accent); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸"; font-size: 11px; }
details.more[open] summary::before { content: "▾"; }
details.more .st { margin-top: 4px; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.filebtn { position: relative; }
.stk { width: 3.2ch; min-width: 44px; text-align: center; font: inherit; font-weight: 700; color: inherit; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 2px 4px; -moz-appearance: textfield; }
.stk::-webkit-outer-spin-button, .stk::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.nutri { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--surface2); border-radius: 16px; padding: 12px 14px; }
.nutri .big { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.1; }
.estb { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--s2); color: #fff; }
.fridge-note { background: var(--lilac); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
details.rules summary { cursor: pointer; font-family: var(--font-display); font-size: 20px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.rules summary::-webkit-details-marker { display: none; }
details.rules summary::after { content: "展開"; font-family: var(--font-body); font-size: 13px; color: var(--ink2); }
details.rules[open] summary::after { content: "收合"; }
.rules ol, .rules ul { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.back { display: flex; flex-direction: column; gap: 8px; }
.back .b { display: grid; grid-template-columns: 1fr; gap: 2px; background: var(--surface2); border-radius: 14px; padding: 10px 12px; }
.back .b b { font-weight: 700; }
.back .b span { font-size: 13px; color: var(--ink2); }

/* nav + toast */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 2px solid var(--outline); padding: 6px max(12px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 54px; padding: 6px 0; border-radius: 16px; color: var(--ink2); font-size: 12px; }
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
/* password sheet */
#sheet { position: fixed; inset: 0; z-index: 60; background: rgba(40, 28, 22, .5); display: flex; align-items: flex-end; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#sheet[hidden] { display: none; }
#sheet .box { width: 100%; max-width: 440px; background: var(--surface); border: 2px solid var(--outline); box-shadow: 0 4px 0 var(--outline); border-radius: 24px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
#sheet h2 { font-size: 20px; }
#sheet input[type="password"] { width: 100%; font: inherit; font-size: 18px; color: var(--ink); background: var(--surface2); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 48px; }
#sheet .err { color: var(--s0); font-size: 13px; min-height: 1.2em; }
#sheet .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink2); }
#sheet .chk input { width: 20px; height: 20px; accent-color: var(--accent); }
#sheet .acts { display: flex; gap: 8px; justify-content: flex-end; }
.lockbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--lilac); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.lockbar svg, .pill svg { width: 14px; height: 14px; flex: none; }
.pill.lock { background: var(--lilac); border-color: transparent; color: var(--ink); }
input:disabled { opacity: .55; }
.filebtn.off { opacity: .5; pointer-events: none; }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; max-width: calc(100vw - 32px); transition: opacity .2s, transform .2s; }

#tour { position: fixed; inset: 0; z-index: 50; display: none; }
#tour.on { display: block; }
#tour.dim { background: rgba(40, 28, 22, .55); }
#tourSpot { position: fixed; display: none; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(40, 28, 22, .55); outline: 3px solid var(--accent); pointer-events: none; }
#tourDemo { position: fixed; display: none; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px) + 190px); max-width: 496px; margin: 0 auto; overflow: hidden; background: var(--surface); border: 2px solid var(--outline); border-radius: 22px; padding: 14px; box-shadow: 0 4px 0 var(--outline); }
#tourDemo { flex-direction: column; gap: 8px; align-items: flex-start; }
#tourDemo .hint { margin: 0; }
#tourDemo #demoImg { flex: 1 1 auto; min-height: 0; max-width: 100%; max-height: 100%; width: auto; height: auto; align-self: center; object-fit: contain; }

#tourBox { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); max-width: 496px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
#tourBox .tb-cat { flex: none; width: 108px; margin-bottom: -8px; transform-origin: 50% 95%; animation: tbPop .55s cubic-bezier(.3, 1.7, .5, 1) both; }
#tourBox .tb-hop { position: relative; transform-origin: 50% 95%; animation: tbHop 1.2s ease-in-out .55s infinite; }
#tourBox .tb-hop .cat { width: 100%; height: auto; display: block; }
#tourBox .tb-rays { position: absolute; left: 22%; top: -14px; width: 60%; height: auto; animation: tbRays .6s ease-in-out infinite alternate; }
#tourBox .tb-star { display: none; position: absolute; left: -6px; top: 8px; width: 22px; height: 22px; animation: tbRays .8s ease-in-out infinite alternate; }
@keyframes tbPop { from { transform: translateY(40px) scale(.2) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes tbHop { 0%, 100% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-14px) rotate(4deg); } 65% { transform: translateY(-14px) rotate(-4deg); } }
@keyframes tbRays { from { transform: scale(.85); opacity: .7; } to { transform: scale(1.1); opacity: 1; } }

#tourBox .tb-text { font-size: 15px; line-height: 1.55; }
#tourBox .tb-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
#tourBox .tb-step { font-size: 12px; color: var(--ink2); }
#tourBox .tb-btns { display: flex; gap: 6px; }

  /* ---------- 歷史紀錄：每個月、每一週 ---------- */
  function weekStart(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }

    var poop = keys.reduce(function (s, k) { return s + poopOf(k); }, 0), dayN = keys.filter(function (k) { return items.some(function (x) { return dayKey(x.m.t) === k; }); }).length;

  function historyHtml(all) {

      var items = byMonth[mk], y = Number(mk.slice(0, 4)), mo = Number(mk.slice(5)) - 1;

          var di = items.filter(function (x) { return dayKey(x.m.t) === k; });

            '<span>' + DAYN[dd.getDay()] + '</span><span>' + (di.length ? fmt1(a) : dd.getDate()) + '</span></i>';
        }

          var a0 = new Date(wkeys[0] + "T00:00"), a1 = new Date(wkeys[wkeys.length - 1] + "T00:00");

      }
      h += '</div></details></section>';
    });
    return h + '<div class="hint" style="text-align:center">格子顏色是當天平均食欲，數字是平均分數；熱量是有紀錄那幾天的平均。</div>';

    function mk(n, dt, offered, eaten, score, extras, parts) { return { n: n, parts: parts, m: { id: "demo" + n, t: t0 + dt * H, offered: offered, eaten: eaten, score: score, extras: extras, symptoms: [], note: "" } }; }
    return [
      mk(1, 0, 50, 50, 4, [], [{ can: 1, g: 50, src: "open", round: 1, rem: 40 }]),
      mk(2, 4.5, 50, 40, 3, ["yz"], [{ can: 1, g: 40, src: "fridge", round: 1 }, { can: 2, g: 10, src: "open", round: 1, rem: 70 }]),
      mk(3, 10, 50, 25, 2, [], [{ can: 2, g: 50, src: "fridge", round: 1 }]),
      mk(4, 13.5, 50, 50, 4, ["probiotic"], [{ can: 2, g: 20, src: "fridge", round: 1 }, { can: 3, g: 30, src: "open", round: 1, rem: 60 }])
    ];
  }
  function demoHtml(items) {
    return '<div class="demo-tag">範例，不是真的紀錄</div><div class="hint">按「存成圖片」會變成這樣：</div><img id="demoImg" class="dayimg" alt="範例：一天吃飯狀況圖片">';
  }
  function showDemo(on) {
    var p = document.getElementById("tourDemo");
    if (!on) { p.style.display = "none"; return; }
    var items = demoItems();
    p.innerHTML = demoHtml(items); p.style.display = "flex"; p.scrollTop = 0;
    var put = function () { var im = document.getElementById("demoImg"); if (im && demoUrl) im.src = demoUrl; };
    if (demoUrl) { put(); return; }
    dayImage("demo", items).then(function (blob) { if (blob) { demoUrl = URL.createObjectURL(blob); put(); } }).catch(function () { /* image is optional */ });
  }
  function tourEl() {
    var st = TOUR[tourI], el = st.t ? document.querySelector(st.t) : null;
    if (el && st.up) el = el.closest(st.up);
    return el;
  }
  function tourPlace(scroll) {
    var root = document.getElementById("tour"), spot = document.getElementById("tourSpot"), el = tourEl();
    root.className = "on" + (el ? "" : " dim");
    if (!el) { spot.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    if (scroll && !el.closest("nav")) { window.scrollTo(0, Math.max(0, window.pageYOffset + r.top - 110)); r = el.getBoundingClientRect(); }
    spot.style.display = "block";
    spot.style.left = (r.left - 6) + "px"; spot.style.top = (r.top - 6) + "px";
    spot.style.width = (r.width + 12) + "px"; spot.style.height = (r.height + 12) + "px";
  }
  function tourShow() {
    var st = TOUR[tourI];
    if (st.tab !== tab) { tab = st.tab; render(); }
    var last = tourI === TOUR.length - 1;
    document.getElementById("tourBox").innerHTML = '<div class="tb-cat"><div class="tb-hop">' + wikuImg("hop", "cat") + TOUR_FX + '</div></div><div class="tb-main"><div class="tb-text">' + esc(st.x) + '</div><div class="tb-row"><span class="tb-step num">' + (tourI + 1) + ' / ' + TOUR.length + '</span><span class="tb-btns">' +
      (last ? "" : '<button class="btn ghost small" data-tour="skip">跳過</button>') + (tourI > 0 ? '<button class="btn ghost small" data-tour="prev">上一步</button>' : "") +
      '<button class="btn small" data-tour="next">' + (last ? "開始使用" : "下一步") + '</button></span></div></div>';
    showDemo(!!st.demo);
    tourPlace(true);
  }
  function startTour() { tourOn = true; tourI = 0; tab = "today"; render(); window.scrollTo(0, 0); tourShow(); }
  function endTour() {
    tourOn = false; document.getElementById("tour").className = ""; showDemo(false);
    lsSet("wiku.tour", "1"); tab = "today"; render(); window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-tour]");
    if (!b) return;
    var a = b.getAttribute("data-tour");
    if (a === "skip") { endTour(); return; }
    if (a === "prev") { tourI = Math.max(0, tourI - 1); tourShow(); return; }
    if (tourI >= TOUR.length - 1) { endTour(); return; }
    tourI++; tourShow();
  });
  window.addEventListener("resize", function () { if (tourOn) tourPlace(false); });

  /* ---------- 啟動 ---------- */
  loadLocal();
  loadKey();
  loadQueue();
  render();
  sync();
  setInterval(function () {
    if (syncing || document.visibilityState !== "visible") return;
    if (queue.length && syncErr !== "badkey" && syncErr !== "noperm") sync();
    else if (Date.now() - lastSync > 90000) sync();
  }, 20000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" ? (queue.length || Date.now() - lastSync > 15000) : queue.length) sync();
  });
  window.addEventListener("pagehide", function () { if (queue.length) sync(); });
  window.addEventListener("online", function () { sync(); });

  lsSet("wiku.t", "1");
  if (lsGet("wiku.t") === "1" && lsGet("wiku.tour") !== "1") setTimeout(startTour, 700);
})();
</script>
</body>
</html>
