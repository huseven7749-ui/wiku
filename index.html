<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WIKU 餵食日記</title>
<meta name="description" content="WIKU 每一餐吃了什麼、吃多少、食欲幾分，都記在這裡。">
<meta name="theme-color" content="#EFE8E0">
<meta property="og:type" content="website">
<meta property="og:title" content="WIKU 餵食日記">
<meta property="og:description" content="WIKU 每一餐吃了什麼、吃多少、食欲幾分">
<meta property="og:image" content="https://huseven7749-ui.github.io/wiku/og.png">
<meta property="og:url" content="https://huseven7749-ui.github.io/wiku/">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="WIKU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one phone-width column. Header with WIKU, then a card stack per tab (今天 / 紀錄 / 罐罐), bottom tab bar. */
:root {
  --outline: #8C7A6E; --dot: #E6DCD1;
  --bg: #EFE8E0;          /* lilac-grey, from the cat's coat shadow */
  --surface: #FAF6F1;     /* cat cream */
  --surface2: #EFE7DE;
  --ink: #4A3F3A;
  --ink2: #7E6F66;
  --line: #DDD2C7;
  --accent: #B3665D;      /* ear pink, strong enough for white text */
  --on-accent: #FFFFFF;
  --accent-soft: #F1DDD6;
  --stripe: #D8B48F;      /* tabby brown-grey */
  --lilac: #E1D9E4;
  --s4: #3F8F63; --s3: #7E9F3C; --s2: #C9921F; --s1: #D1692F; --s0: #BF3F3A;
  --font-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg) radial-gradient(var(--dot) 1.6px, transparent 1.7px) 0 0 / 24px 24px; color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 104px;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
.top .wk { flex: none; width: 64px; height: auto; }
.top .name { font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.top .sub { color: var(--ink2); font-size: 13px; }
.sum { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; background: var(--surface); border: 1.5px solid var(--outline); font-size: 13px; color: var(--ink2); }
.pill b { color: var(--ink); font-weight: 700; }
.pill.ok { background: var(--accent-soft); border-color: transparent; color: var(--ink); }

/* cards */
.card { background: var(--surface); border: 2px solid var(--outline); box-shadow: 0 4px 0 var(--outline); border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2 { font-size: 20px; }
.card .hint { color: var(--ink2); font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.between { justify-content: space-between; }
.label { font-size: 13px; color: var(--ink2); letter-spacing: .04em; }

/* plan card */
.planhead { display: flex; align-items: flex-end; gap: 10px; }
.planhead .cat { flex: none; width: 112px; height: auto; margin-bottom: -4px; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--accent-soft); border: 2px solid var(--outline); border-radius: 20px; padding: 10px 14px; }
.bubble::before { content: ""; position: absolute; left: -9px; bottom: 18px; width: 14px; height: 14px; background: var(--accent-soft); border-left: 2px solid var(--outline); border-bottom: 2px solid var(--outline); transform: rotate(45deg); border-radius: 3px; }
.bubble .big { font-family: var(--font-display); font-size: 19px; line-height: 1.3; }
.bubble .small { font-size: 13px; color: var(--ink2); }
.steps { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface2); border-radius: 14px; padding: 10px 12px; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.tag.fridge { background: var(--lilac); }
.tag.open { background: var(--accent); color: var(--on-accent); }
.tag.keep { background: var(--surface); border: 1px dashed var(--stripe); color: var(--ink2); }
.steps .g { font-weight: 700; }
.steps .nm { font-weight: 500; }
.steps .why { display: block; font-size: 13px; color: var(--ink2); }

.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 42px; height: 42px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); font-weight: 700; font-size: 14px; flex: none; }
.stepper button:active { background: var(--lilac); }
.stepper .val { display: flex; align-items: baseline; justify-content: center; gap: 2px; flex: 1; min-width: 64px; font-family: var(--font-display); font-size: 26px; }
.stepper input { width: 3.1ch; min-width: 56px; text-align: center; font: inherit; background: transparent; color: inherit; border: 0; border-bottom: 2px solid var(--line); padding: 0; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper .u { font-size: 14px; color: var(--ink2); }

.suggest { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; border-radius: 14px; padding: 10px 12px; background: var(--surface2); border: 1px dashed var(--stripe); font-size: 14px; }
.btn { box-shadow: 0 3px 0 var(--outline); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { background: var(--surface2); color: var(--ink); border: 1.5px solid var(--outline); font-weight: 500; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--outline); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; min-height: 52px; font-size: 17px; }
.btn.danger { background: var(--s0); color: #fff; }

/* score */
.scores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.score { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface2); min-width: 0; }
.score .wk { width: 100%; max-width: 54px; height: auto; }
.score .pts { font-family: var(--font-display); font-size: 18px; line-height: 1; color: var(--sc); }
.score .t { font-size: 11px; line-height: 1.25; text-align: center; color: var(--ink2); }
.score[aria-pressed="true"] { border-color: var(--sc); background: var(--surface); box-shadow: 0 0 0 2px var(--sc) inset; }
.score[aria-pressed="true"] .t { color: var(--ink); font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface2); font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.chip.warn[aria-pressed="true"] { background: var(--s0); border-color: var(--s0); color: #fff; }
.quick { display: flex; gap: 8px; }
.quick .chip { min-height: 34px; font-size: 13px; padding: 0 12px; }

textarea, input[type="datetime-local"] { width: 100%; font: inherit; color: var(--ink); background: var(--surface2); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
textarea { min-height: 72px; resize: vertical; }
/* iPhone Safari gives date inputs a fixed native width that ignores width:100% — reset it so the box stays inside the card */
input[type="datetime-local"] { min-height: 44px; display: block; min-width: 0; max-width: 100%; box-sizing: border-box; -webkit-appearance: none; appearance: none; text-align: left; line-height: 1.4; }
input[type="datetime-local"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
input[type="datetime-local"]::-webkit-datetime-edit { padding: 0; }
.field { min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.miss { font-size: 13px; color: var(--ink2); text-align: center; }

/* mini list */
.mini { display: flex; flex-direction: column; gap: 8px; }
.mini .it { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: 14px; padding: 8px 12px; min-width: 0; }
.mini .it .tx { flex: 1; min-width: 0; font-size: 14px; }
.mini .it .tx span { display: block; font-size: 12px; color: var(--ink2); }
.mini button.it { width: 100%; text-align: left; border: 1.5px solid transparent; }
.mini button.it:active { border-color: var(--outline); }
.mini .it .chev { flex: none; font-size: 13px; color: var(--ink2); }
.badge { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 18px; color: #fff; background: var(--sc); }

/* history */
.trend { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; align-items: end; }
.trend .d { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.trend .bars { display: flex; align-items: flex-end; justify-content: center; gap: 2px; height: 64px; width: 100%; }
.trend .bars i { flex: 0 1 9px; min-width: 4px; border-radius: 3px 3px 1px 1px; background: var(--sc); }
.trend .kc { font-size: 12px; font-weight: 700; line-height: 1.2; }
.trend .dl { font-size: 11px; color: var(--ink2); line-height: 1.2; white-space: nowrap; }
.trend .d.today .dl { color: var(--accent); font-weight: 700; }
.day { display: flex; flex-direction: column; gap: 10px; }
.dayh { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dayh h3 { font-size: 18px; }
.dayh .meta { color: var(--ink2); font-size: 13px; }
.meal { display: flex; flex-direction: column; gap: 6px; background: var(--surface2); border-radius: 16px; padding: 12px; min-width: 0; }
.meal .l1 { display: flex; align-items: center; gap: 10px; }
.meal .ttl { flex: 1; min-width: 0; }
.meal .ttl b { font-weight: 700; }
.meal .tm { flex: none; font-size: 17px; font-weight: 700; color: var(--ink); background: var(--accent-soft); border-radius: 10px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
.meal .ttl span { display: block; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
.meal .note { font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
.meal .acts { display: flex; gap: 8px; justify-content: flex-end; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; }
.tagrow .t2 { font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--lilac); }
.tagrow .t2.warn { background: var(--s0); color: #fff; }
.copybox { width: 100%; }
.dayimg { display: block; width: 100%; height: auto; border-radius: 16px; border: 1px solid var(--line); }
.empty { text-align: center; color: var(--ink2); padding: 20px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty .wk { width: 130px; height: auto; }

/* cans */
.can { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; background: var(--surface2); border-radius: 16px; padding: 10px 12px; border: 2px solid transparent; min-width: 0; }
.can .no { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--lilac); font-family: var(--font-display); font-size: 20px; }
.can.now { border-color: var(--accent); background: var(--surface); }
.can.now .no { background: var(--accent); color: var(--on-accent); }
.can.done .no { background: var(--s4); color: #fff; }
.can .nm { font-weight: 700; overflow-wrap: anywhere; }
.can .nm span { font-weight: 400; color: var(--ink2); font-size: 13px; display: block; }
.can .st { font-size: 12px; color: var(--ink2); font-weight: 400; margin-top: 2px; }
.can .gw { display: flex; align-items: baseline; gap: 2px; justify-content: flex-end; }
.can .gw input { width: 3.2ch; min-width: 46px; text-align: right; font: inherit; font-weight: 700; color: inherit; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 6px; -moz-appearance: textfield; }
.can .gw input::-webkit-outer-spin-button, .can .gw input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
details.more { margin-top: 4px; }
details.more summary { cursor: pointer; list-style: none; font-size: 12px; color: var(--accent); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸"; font-size: 11px; }
details.more[open] summary::before { content: "▾"; }
details.more .st { margin-top: 4px; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.filebtn { position: relative; }
.stk { width: 3.2ch; min-width: 44px; text-align: center; font: inherit; font-weight: 700; color: inherit; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 2px 4px; -moz-appearance: textfield; }
.stk::-webkit-outer-spin-button, .stk::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.nutri { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--surface2); border-radius: 16px; padding: 12px 14px; }
.nutri .big { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.1; }
.estb { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--s2); color: #fff; }
.fridge-note { background: var(--lilac); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
details.rules summary { cursor: pointer; font-family: var(--font-display); font-size: 20px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.rules summary::-webkit-details-marker { display: none; }
details.rules summary::after { content: "展開"; font-family: var(--font-body); font-size: 13px; color: var(--ink2); }
details.rules[open] summary::after { content: "收合"; }
.rules ol, .rules ul { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.back { display: flex; flex-direction: column; gap: 8px; }
.back .b { display: grid; grid-template-columns: 1fr; gap: 2px; background: var(--surface2); border-radius: 14px; padding: 10px 12px; }
.back .b b { font-weight: 700; }
.back .b span { font-size: 13px; color: var(--ink2); }

/* nav + toast */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 2px solid var(--outline); padding: 6px max(12px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 54px; padding: 6px 0; border-radius: 16px; color: var(--ink2); font-size: 12px; }
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
/* password sheet */
#sheet { position: fixed; inset: 0; z-index: 60; background: rgba(40, 28, 22, .5); display: flex; align-items: flex-end; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#sheet[hidden] { display: none; }
#sheet .box { width: 100%; max-width: 440px; background: var(--surface); border: 2px solid var(--outline); box-shadow: 0 4px 0 var(--outline); border-radius: 24px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
#sheet h2 { font-size: 20px; }
#sheet input[type="password"] { width: 100%; font: inherit; font-size: 18px; color: var(--ink); background: var(--surface2); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; min-height: 48px; }
#sheet .err { color: var(--s0); font-size: 13px; min-height: 1.2em; }
#sheet .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink2); }
#sheet .chk input { width: 20px; height: 20px; accent-color: var(--accent); }
#sheet .acts { display: flex; gap: 8px; justify-content: flex-end; }
.lockbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--lilac); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.lockbar svg, .pill svg { width: 14px; height: 14px; flex: none; }
.pill.lock { background: var(--lilac); border-color: transparent; color: var(--ink); }
input:disabled { opacity: .55; }
.filebtn.off { opacity: .5; pointer-events: none; }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; max-width: calc(100vw - 32px); transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
#tour { position: fixed; inset: 0; z-index: 50; display: none; }
#tour.on { display: block; }
#tour.dim { background: rgba(40, 28, 22, .55); }
#tourSpot { position: fixed; display: none; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(40, 28, 22, .55); outline: 3px solid var(--accent); pointer-events: none; }
#tourDemo { position: fixed; display: none; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px) + 190px); max-width: 496px; margin: 0 auto; overflow: hidden; background: var(--surface); border: 2px solid var(--outline); border-radius: 22px; padding: 14px; box-shadow: 0 4px 0 var(--outline); }
#tourDemo { flex-direction: column; gap: 8px; align-items: flex-start; }
#tourDemo .hint { margin: 0; }
#tourDemo #demoImg { flex: 1 1 auto; min-height: 0; max-width: 100%; max-height: 100%; width: auto; height: auto; align-self: center; object-fit: contain; }
.demo-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--accent); color: var(--on-accent); }
#tourBox { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); max-width: 496px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
#tourBox .tb-cat { flex: none; width: 108px; margin-bottom: -8px; transform-origin: 50% 95%; animation: tbPop .55s cubic-bezier(.3, 1.7, .5, 1) both; }
#tourBox .tb-hop { position: relative; transform-origin: 50% 95%; animation: tbHop 1.2s ease-in-out .55s infinite; }
#tourBox .tb-hop .cat { width: 100%; height: auto; display: block; }
#tourBox .tb-rays { position: absolute; left: 22%; top: -14px; width: 60%; height: auto; animation: tbRays .6s ease-in-out infinite alternate; }
#tourBox .tb-star { display: none; position: absolute; left: -6px; top: 8px; width: 22px; height: 22px; animation: tbRays .8s ease-in-out infinite alternate; }
@keyframes tbPop { from { transform: translateY(40px) scale(.2) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes tbHop { 0%, 100% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-14px) rotate(4deg); } 65% { transform: translateY(-14px) rotate(-4deg); } }
@keyframes tbRays { from { transform: scale(.85); opacity: .7; } to { transform: scale(1.1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #tourBox .tb-cat, #tourBox .tb-hop, #tourBox .tb-rays, #tourBox .tb-star { animation: none; } }
#tourBox .tb-main { position: relative; flex: 1; min-width: 0; background: var(--surface); border: 2px solid var(--outline); box-shadow: 0 4px 0 var(--outline); border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
#tourBox .tb-text { font-size: 15px; line-height: 1.55; }
#tourBox .tb-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
#tourBox .tb-step { font-size: 12px; color: var(--ink2); }
#tourBox .tb-btns { display: flex; gap: 6px; }
</style>

    if (s && (s.nutV === 2 || s.nutV === 3) && Array.isArray(s.nut) && s.nut.length === 7) out.nut = s.nut.map(function (v, i) { return v && v.k > 0 && v.w >= 0 && v.w <= 100 ? { k: v.k, w: v.w } : out.nut[i]; });
    /* v3：克勞德 05 號改用包裝實際標示；舊的推估值（90／80）沒被改過就換成新的 */
    if (s && s.nutV === 2 && out.nut[6] && out.nut[6].k === 0.9 && out.nut[6].w === 80) out.nut[6] = defNut()[6];

  }
  function loadLocal() {
    try { var m = JSON.parse(lsGet(LS_M) || "[]"); if (Array.isArray(m)) meals = m; } catch (e) { meals = []; }
    try { settings = normSettings(JSON.parse(lsGet(LS_S) || "null")); } catch (e) { /* default */ }
    var t = lsGet(LS_T); if (t === "log" || t === "cans" || t === "today") tab = t;
  }
  function saveLocal() { lsSet(LS_M, JSON.stringify(meals)); lsSet(LS_S, JSON.stringify(settings)); }

  /* ---------- 編輯金鑰 + GitHub 同步 ----------
     紀錄存在 GitHub 專案 huseven7749-ui/wiku 的 data 分支（data.json）。
     任何人都讀得到；只有貼了 GitHub 金鑰（只能改這個專案）的手機能寫入。金鑰只存在那支手機。 */
  var GH_OWNER = "huseven7749-ui", GH_REPO = "wiku", GH_BRANCH = "data", GH_PATH = "data.json";
  var LOCALDEV = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var QS = new URLSearchParams(location.search);
  var API = (LOCALDEV && QS.get("api")) || "https://api.github.com";
  var RAW = (LOCALDEV && QS.get("raw")) || "https://raw.githubusercontent.com";
  var LS_K = "wiku.gh.key", LS_Q = "wiku.queue.v1";
  var key = null;            // 這支手機的 GitHub 金鑰
  var queue = [];            // 還沒上傳到 GitHub 的變動
  var syncing = false, syncAgain = false, lastSync = 0, syncErr = "", keyArmed = false;

  function loadKey() {
    key = lsGet(LS_K) || null;

  }
  function setKey(k, keep) {

    try { if (k && !keep) sessionStorage.setItem(LS_K, k); else sessionStorage.removeItem(LS_K); } catch (e) { /* ignore */ }
  }
  function hasLock() { return true; }
  function isLocked() { return !key; }
  function loadQueue() { try { var q = JSON.parse(lsGet(LS_Q) || "[]"); if (Array.isArray(q)) queue = q; } catch (e) { queue = []; } }
  function saveQueue() { lsSet(LS_Q, JSON.stringify(queue)); }
  function enqueue(op) { queue.push(op); saveQueue(); sync(); }

  function toB64(str) {
    var a = new TextEncoder().encode(str), out = "";
    for (var i = 0; i < a.length; i += 0x8000) out += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000));
    return btoa(out);
  }
  function fromB64(str) {
    var b = atob(String(str).replace(/\s/g, "")), a = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);

  }
  function contentsUrl() { return API + "/repos/" + GH_OWNER + "/" + GH_REPO + "/contents/" + GH_PATH; }
  function ghHeaders(auth) {
    var h = { "Accept": "application/vnd.github+json" };
    if (auth && key) h.Authorization = "Bearer " + key;
    return h;
  }
  function rawGet() {
    return fetch(RAW + "/" + GH_OWNER + "/" + GH_REPO + "/" + GH_BRANCH + "/" + GH_PATH + "?_=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (r.status === 404) return { doc: null, sha: null };
      if (!r.ok) throw { code: "http", status: r.status };
      return r.json().then(function (d) { return { doc: d, sha: null }; });
    });
  }
  function ghGet(auth) {
    return fetch(contentsUrl() + "?ref=" + GH_BRANCH + "&_=" + Date.now(), { headers: ghHeaders(auth), cache: "no-store" }).then(function (r) {
      if (r.status === 404) return { doc: null, sha: null };
      if (r.status === 401 && auth) throw { code: "badkey" };
      if (!r.ok) { if (!auth) return rawGet(); throw { code: "http", status: r.status }; }
      return r.json().then(function (j) { return { doc: JSON.parse(fromB64(j.content || "") || "null"), sha: j.sha }; });
    });
  }
  function ghPut(doc, sha) {
    var body = { message: "WIKU 紀錄更新 " + new Date().toLocaleString("zh-TW", { hour12: false }), content: toB64(JSON.stringify(doc)), branch: GH_BRANCH };
    if (sha) body.sha = sha;
    var h = ghHeaders(true); h["Content-Type"] = "application/json";
    return fetch(contentsUrl(), { method: "PUT", headers: h, body: JSON.stringify(body) }).then(function (r) {
      if (r.ok) return r.json().then(function (j) { return j.content && j.content.sha; });
      return r.json().catch(function () { return {}; }).then(function (j) {
        var msg = String(j && j.message || "");
        if (r.status === 401) throw { code: "badkey" };
        if (r.status === 409 || (r.status === 422 && /sha/i.test(msg))) throw { code: "conflict" };
        if (r.status === 403 || r.status === 404) throw { code: "noperm", status: r.status };
        throw { code: "http", status: r.status };
      });
    });
  }
  function normDoc(d) {
    var out = { app: "wiku", v: 2, meals: [], settings: normSettings(settings), updated: 0 };
    if (d && Array.isArray(d.meals)) out.meals = d.meals.map(cleanMeal).filter(Boolean);
    if (d && d.settings) out.settings = normSettings(d.settings);
    if (d && typeof d.updated === "number") out.updated = d.updated;
    return out;
  }
  function applyOp(doc, op) {
    if (op.type === "upsert" && op.meal) { doc.meals = doc.meals.filter(function (x) { return x.id !== op.meal.id; }); doc.meals.push(op.meal); }
    else if (op.type === "del") doc.meals = doc.meals.filter(function (x) { return x.id !== op.id; });
    else if (op.type === "settings" && op.settings) doc.settings = normSettings(op.settings);
  }
  /* 雲端資料 + 這支手機還沒上傳的變動 = 畫面上看到的 */
  function adopt(doc) {
    var view = normDoc(doc);
    queue.forEach(function (op) { applyOp(view, op); });
    meals = view.meals; settings = view.settings; cloud = true;
    saveLocal();
  }
  function sync() {
    if (syncing) { syncAgain = true; return; }
    syncing = true; syncAgain = false;
    var pending = queue.slice(), tries = 0;
    var attempt = function () {
      tries++;
      return ghGet(!!key).then(function (res) {
        if (!pending.length || !key) { adopt(res.doc); return; }
        var doc = normDoc(res.doc);
        pending.forEach(function (op) { applyOp(doc, op); });
        doc.updated = Date.now();
        return ghPut(doc, res.sha).then(function () {
          queue = queue.slice(pending.length); saveQueue();
          adopt(doc);
        }, function (e) {
          if (e && e.code === "conflict" && tries < 4) return attempt();
          throw e;
        });
      });
    };
    var done = function (err) {
      syncing = false; syncErr = err || "";
      if (!err) lastSync = Date.now();
      render();
      if (syncAgain) sync();
    };
    attempt().then(function () { done(""); }, function (e) {
      var c = e && e.code;
      if (c === "badkey" || c === "noperm") {
        toast(c === "badkey" ? "編輯金鑰失效了，請到「罐罐」重新貼上" : "這把金鑰不能寫入，請確認 Contents 選了 Read and write");
        ghGet(false).then(function (res) { adopt(res.doc); render(); }, function () { /* keep local */ });
        done(c);
      } else done(navigator.onLine === false ? "offline" : "net");
    });
  }
  function syncLabel() {
    if (syncErr === "badkey") return "金鑰失效";
    if (syncErr === "noperm") return "金鑰不能寫入";
    if (queue.length) return (syncErr === "offline" || syncErr === "net") ? "離線・" + queue.length + " 筆待上傳" : "上傳中…";
    if (!cloud) return syncErr ? "連不上網路" : "讀取中…";
    return syncErr ? "離線・顯示上次的紀錄" : "已同步";
  }

  /* 要改資料前先過這關：有金鑰就直接做，沒有就先請他貼金鑰 */
  function guard(fn) { if (!isLocked()) { fn(); return; } openSheet("unlock", fn); }
  function openSheet(mode, then) {
    sheet = { mode: "key", then: then || null };
    var el = document.getElementById("sheet"), h = "";
    h += '<form class="box" id="sheetForm" autocomplete="off"><h2 id="sheetTitle">輸入編輯金鑰</h2>';
    h += '<div class="hint">這支手機目前只能看。貼上你在 GitHub 建立的金鑰（github_pat_ 開頭），這支手機就能記錄、修改。沒有金鑰的人打開網址只能看。</div>';
    h += '<input type="password" id="pwOld" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="GitHub 金鑰">';
    h += '<label class="chk"><input type="checkbox" id="pwRemember" checked>這支手機記住，不用每次貼</label>';
    h += '<div class="err" id="pwErr" role="alert"></div><div class="acts"><button type="button" class="btn ghost" data-sheet="cancel">取消</button><button type="submit" class="btn">確定</button></div></form>';
    el.innerHTML = h; el.hidden = false;
    var first = el.querySelector("input[type=password]"); if (first) setTimeout(function () { first.focus(); }, 30);
  }
  function closeSheet() { sheet = null; var el = document.getElementById("sheet"); el.hidden = true; el.innerHTML = ""; }
  function sheetErr(msg) { var e = document.getElementById("pwErr"); if (e) e.textContent = msg; }
  function submitSheet() {
    if (!sheet) return;
    var then = sheet.then;
    var k = String((document.getElementById("pwOld") || {}).value || "").trim();
    var keep = !!(document.getElementById("pwRemember") || {}).checked;
    if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(k)) { sheetErr("格式不對，金鑰是 github_pat_ 開頭的一長串"); return; }
    sheetErr("確認中…");
    fetch(API + "/repos/" + GH_OWNER + "/" + GH_REPO, { headers: { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + k }, cache: "no-store" }).then(function (r) {
      if (r.status === 401) { sheetErr("這把金鑰無效或已過期，請到 GitHub 重新建立"); return; }
      if (!r.ok) { sheetErr("這把金鑰打不開 wiku 專案，請確認有選到 wiku"); return; }
      setKey(k, keep); syncErr = ""; keyArmed = false; closeSheet(); render(); toast("這支手機可以記錄了");
      sync();
      if (then) then();
    }, function () { sheetErr("連不上 GitHub，請確認網路後再試一次"); });
  }
  document.addEventListener("submit", function (e) { if (e.target && e.target.id === "sheetForm") { e.preventDefault(); submitSheet(); } });
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-sheet]") : null;
    if (b) { closeSheet(); return; }
    if (e.target && e.target.id === "sheet") closeSheet();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheet) closeSheet(); });

  /* ---------- 餵食排程（重播所有紀錄） ---------- */
  function allocate(st, need, sizes) {
    var parts = [], guard = 0;
    if (st.left && st.left.g > 0) {
      var take = Math.min(need, st.left.g);
      parts.push({ can: st.left.can, g: take, src: "fridge", round: st.left.round });
      st.left.g -= take; need -= take;
      if (st.left.g <= 0) st.left = null;
    }
    while (need > 0 && guard++ < 30) {
      var idx = st.next % 7, round = Math.floor(st.next / 7) + 1;
      var size = sizes[idx], tk = Math.min(need, size), rem = size - tk;
      parts.push({ can: idx + 1, g: tk, src: "open", rem: rem, round: round });
      need -= tk; st.next++;
      if (rem > 0) st.left = { can: idx + 1, g: rem, round: round };
    }
    return parts;
  }
  function cloneSt(st) { return { next: st.next, left: st.left ? { can: st.left.can, g: st.left.g, round: st.left.round } : null }; }

  function computeAll() {
    var sorted = meals.slice().sort(function (a, b) { return a.t - b.t; });
    var st = { next: 0, left: null }, list = [], perDay = {};
    sorted.forEach(function (m, i) {
      var before = cloneSt(st);
      var parts = allocate(st, m.offered, settings.sizes);
      var dk = dayKey(m.t); perDay[dk] = (perDay[dk] || 0) + 1;
      list.push({ m: m, n: perDay[dk], seq: i + 1, parts: parts, before: before });
    });
    return { list: list, st: st };
  }
  function planFor(st, offered) {
    var s = cloneSt(st), parts = allocate(s, offered, settings.sizes);
    return { parts: parts, after: s, round: parts.length ? parts[0].round : Math.floor(st.next / 7) + 1 };
  }
  function canShort(n) { return CANS[n - 1].short; }
  function fmtN(n) { return String(Math.round(n)); }
  function partsNut(parts) {
    var kcal = 0, water = 0, g = 0;
    parts.forEach(function (p) { var n = settings.nut[p.can - 1]; kcal += p.g * n.k; water += p.g * n.w / 100; g += p.g; });
    return { kcal: kcal, water: water, g: g };
  }
  function mealNut(x) {
    var t = partsNut(x.parts), r = x.m.offered ? x.m.eaten / x.m.offered : 0;
    return { offKcal: t.kcal, offWater: t.water, eatKcal: t.kcal * r, eatWater: t.water * r };
  }
  function dayNut(items) {
    var d = { offKcal: 0, eatKcal: 0, offWater: 0, eatWater: 0, eatG: 0 };
    items.forEach(function (x) { var n = mealNut(x); d.offKcal += n.offKcal; d.eatKcal += n.eatKcal; d.offWater += n.offWater; d.eatWater += n.eatWater; d.eatG += x.m.eaten; });
    d.pct = d.eatG > 0 ? d.eatWater / d.eatG * 100 : 0;
    return d;
  }
  function nutriBox(items) {
    var d = dayNut(items);
    return '<div class="nutri"><div><span class="label">今日吃進熱量</span><div><b class="big num">' + fmtN(d.eatKcal) + '</b> 大卡</div><span class="hint">供給 ' + fmtN(d.offKcal) + ' 大卡</span></div>' +
      '<div><span class="label">今日吃進水份</span><div><b class="big num">' + fmtN(d.eatWater) + '</b> g</div><span class="hint">含水率 ' + fmtN(d.pct) + '%</span></div></div>';
  }
  function partsLabel(parts) { return parts.map(function (p) { return p.can + "號" + canShort(p.can) + " " + p.g + "g"; }).join(" + "); }

  /* ---------- 草稿 ---------- */
  function newDraft() {
    return { id: null, t: Date.now(), tAuto: true, offered: settings.portion, offTouched: false, eaten: null, eTouched: false, score: null, extras: [], symptoms: [], note: "" };
  }
  function draftFromMeal(m) {
    return { id: m.id, t: m.t, tAuto: false, offered: m.offered, offTouched: true, eaten: m.eaten, eTouched: true, score: m.score, extras: (m.extras || []).slice(), symptoms: (m.symptoms || []).slice(), note: m.note || "" };
  }
  function prefillEaten() {
    if (draft.eTouched || draft.score == null) return;
    var s = draft.score;
    draft.eaten = s === 4 ? draft.offered : s === 3 ? Math.max(0, draft.offered - 5) : s === 2 ? Math.round(draft.offered / 2) : s === 1 ? Math.min(5, draft.offered) : 0;
  }

  /* ---------- 時間工具 ---------- */
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function dayKey(t) { var d = new Date(t); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
  function dayLabel(t) { var d = new Date(t); return (d.getMonth() + 1) + "/" + d.getDate() + "（" + DAYN[d.getDay()] + "）"; }
  function hm(t) { var d = new Date(t); return p2(d.getHours()) + ":" + p2(d.getMinutes()); }
  function toLocalInput(t) { var d = new Date(t); return dayKey(t) + "T" + p2(d.getHours()) + ":" + p2(d.getMinutes()); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function scoreFull(v) { return SCORES.filter(function (s) { return s.v === v; })[0].full; }
  function avg(arr) { return arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : null; }
  function fmt1(n) { return n == null ? "-" : (Math.round(n * 10) / 10).toString(); }
  function labelOf(list, k) { var f = list.filter(function (x) { return x.k === k; })[0]; return f ? f.label : k; }

  /* ---------- 畫面 ---------- */
  function headerHtml(all) {
    var today = dayKey(Date.now());
    var tm = all.list.filter(function (x) { return dayKey(x.m.t) === today; });
    var a = avg(tm.map(function (x) { return x.m.score; }));
    var prob = tm.some(function (x) { return (x.m.extras || []).indexOf("probiotic") >= 0; });

      '<div><div class="name">WIKU 餵食日記</div><div class="sub">' + esc(dayLabel(Date.now())) + " ・ " + syncLabel() + '</div></div><button class="btn ghost small" data-act="tour" style="margin-left:auto">教學</button></header>' +
      '<div class="sum"><span class="pill">今天 <b class="num">' + tm.length + '</b> 餐</span>' +
      '<span class="pill">平均 <b class="num">' + fmt1(a) + '</b> 分</span>' +
      '<span class="pill">熱量 <b class="num">' + fmtN(dayNut(tm).eatKcal) + '</b> 大卡</span>' +
      '<span class="pill ' + (prob ? "ok" : "") + '">益生菌 <b>' + (prob ? "已吃" : "未吃") + '</b></span>' +
      (isLocked() ? '<button class="pill lock" data-act="unlock">' + LOCK_SVG + '只能看・輸入金鑰</button>' : '<span class="pill ok">可以記錄</span>') + '</div>';
  }

  function stepsHtml(plan, used) {
    var h = '<ul class="steps">';
    plan.parts.forEach(function (p) {
      var c = CANS[p.can - 1];
      if (p.src === "fridge") {
        h += '<li><span class="tag fridge">冰箱回溫</span><div><span class="nm">' + p.can + "號【" + esc(c.short) + '】</span> <span class="g num">' + p.g + 'g</span><span class="why">拿出保鮮盒裡的量，回溫後使用' + ((plan.after.left && plan.after.left.can === p.can) ? "" : "，這" + c.kind + "到這餐用完") + '</span></div></li>';
      } else {
        h += '<li><span class="tag open">開' + p.can + "號" + c.kind + '</span><div><span class="nm">【' + esc(c.short) + '】<span class="num"> 整' + c.kind + settings.sizes[p.can - 1] + 'g</span> ・ 挖 <span class="g num">' + p.g + 'g</span>' +
          '<span class="why">庫存開罐前剩 <b class="num">' + (settings.stock[p.can - 1] - used[p.can - 1]) + '</b> ' + c.kind + ((settings.stock[p.can - 1] - used[p.can - 1]) <= 0 ? "，沒有庫存了，記得補貨" : "") + '</span>' +
          (p.rem > 0 ? '<span class="why">剩下 <b class="num">' + p.rem + 'g</b> 從' + c.kind + '中另外挖到保鮮盒冰起來</span>' : '<span class="why">這' + c.kind + '剛好用完</span>') + '</div></li>';
      }
    });
    var last = plan.parts[plan.parts.length - 1];
    if (last && last.src === "fridge" && plan.after.left) {
      h += '<li><span class="tag keep">放回冰箱</span><div><span class="nm">' + plan.after.left.can + "號【" + esc(canShort(plan.after.left.can)) + '】</span> <span class="g num">' + plan.after.left.g + 'g</span><span class="why">沒碰到的部分繼續冰回冰箱</span></div></li>';
    }
    return h + "</ul>";
  }

  function streakAt(all, portion) {
    var list = all.list.slice().sort(function (a, b) { return b.m.t - a.m.t; }), n = 0;
    for (var i = 0; i < list.length; i++) {
      var m = list[i].m;
      if (m.offered === portion && m.eaten >= m.offered) n++; else break;
    }
    return n;
  }
  function suggestion(all) {
    if (draft.id || !all.list.length) return null;
    var list = all.list.slice().sort(function (a, b) { return b.m.t - a.m.t; });
    var last = list[0].m;
    if (last.offered !== draft.offered) return null;
    if (last.eaten < last.offered) {
      return { dir: -5, text: "上一餐 " + last.offered + "g 沒吃完，建議減 5g" };
    }
    var streak = 0;
    for (var i = 0; i < list.length; i++) {
      var m = list[i].m;
      if (m.offered === last.offered && m.eaten >= m.offered) streak++; else break;
    }
    if (streak >= 2) return { dir: 5, text: "已連續 " + streak + " 餐 " + last.offered + "g 都吃完，可以加 5g" };
    return null;
  }

  function todayTab(all) {
    var editing = !!draft.id;
    var found = editing ? all.list.filter(function (x) { return x.m.id === draft.id; })[0] : null;
    var baseSt = editing && found ? found.before : all.st;
    var dk0 = dayKey(draft.t);
    var n = editing && found ? found.n : all.list.filter(function (x) { return dayKey(x.m.t) === dk0; }).length + 1;
    var plan = planFor(baseSt, draft.offered);
    var mood = draft.score != null ? draft.score : 3;
    var h = "";

      '<button data-act="step" data-f="offered" data-d="5" aria-label="份量加5克">+5</button></div></div>';
    var sg = suggestion(all);
    if (sg) {
      h += '<div class="suggest"><span>' + esc(sg.text) + '</span><button class="btn small" data-act="applySug" data-d="' + sg.dir + '">' + (sg.dir > 0 ? "加 5g" : "減 5g") + '</button></div>';
    } else if (!editing && streakAt(all, draft.offered) === 1) {
      h += '<div class="hint">' + draft.offered + 'g 已連續吃完 1 餐，再吃完 1 餐就會建議加 5g。</div>';
    }
    h += '</section>';

    // 記錄表單
    var miss = [];
    if (draft.score == null) miss.push("選食欲分數");
    if (draft.eaten == null || isNaN(draft.eaten)) miss.push("填吃的量");
    h += '<section class="card" aria-labelledby="h-rec"><h2 id="h-rec">' + (editing ? "修改這一餐" : "記錄這一餐") + '</h2>';
    if (isLocked()) h += '<div class="lockbar"><span>' + LOCK_SVG + ' 這支手機只能看，要記錄請先輸入編輯金鑰</span><button class="btn small" data-act="unlock">輸入金鑰</button></div>';
    h += '<div class="field"><span class="label">食欲分數</span><div class="scores" role="group" aria-label="食欲分數">';
    SCORES.forEach(function (s) {
      h += '<button class="score" style="--sc:var(--s' + s.v + ')" data-act="score" data-v="' + s.v + '" aria-pressed="' + (draft.score === s.v) + '" aria-label="' + s.v + '分 ' + s.full + '">' +
        wikuHead(s.v) + '<span class="pts num">' + s.v + '</span><span class="t">' + s.short + '</span></button>';
    });
    h += '</div></div>';

    h += '<div class="field"><span class="label">實際吃的量</span><div class="stepper">' +
      '<button data-act="step" data-f="eaten" data-d="-5" aria-label="吃的量減5克">−5</button>' +
      '<button data-act="step" data-f="eaten" data-d="-1" aria-label="吃的量減1克">−1</button>' +
      '<div class="val"><input id="eaten" class="num" type="number" inputmode="decimal" min="0" max="500" step="1" placeholder="0" value="' + (draft.eaten == null ? "" : draft.eaten) + '" aria-label="實際吃的量（克）"><span class="u">g</span></div>' +
      '<button data-act="step" data-f="eaten" data-d="1" aria-label="吃的量加1克">+1</button>' +
      '<button data-act="step" data-f="eaten" data-d="5" aria-label="吃的量加5克">+5</button></div>' +
      '<div class="quick"><button class="chip" data-act="setEaten" data-v="all">全吃完</button><button class="chip" data-act="setEaten" data-v="half">一半</button><button class="chip" data-act="setEaten" data-v="zero">沒吃</button></div></div>';

    h += '<div class="field"><span class="label">備用區（有用到就點）</span><div class="chips">';
    EXTRAS.forEach(function (x) { h += '<button class="chip" data-act="toggle" data-l="extras" data-k="' + x.k + '" aria-pressed="' + (draft.extras.indexOf(x.k) >= 0) + '">' + x.label + '</button>'; });
    h += '</div></div>';

    h += '<div class="field"><span class="label">拉吐狀況</span><div class="chips">';
    SYMPTOMS.forEach(function (x) { h += '<button class="chip warn" data-act="toggle" data-l="symptoms" data-k="' + x.k + '" aria-pressed="' + (draft.symptoms.indexOf(x.k) >= 0) + '">' + x.label + '</button>'; });
    h += '</div></div>';

    h += '<div class="field"><label class="label" for="note">備註</label><textarea id="note" placeholder="例：先聞了才吃、用凍乾拌了才肯吃、吃完會舔碗…">' + esc(draft.note) + '</textarea></div>';

    h += '<button class="btn block" data-act="save"' + (miss.length ? " disabled" : "") + '>' + (isLocked() ? "輸入金鑰並" : "") + (editing ? "儲存修改" : "記下這一餐") + '</button>';
    if (miss.length) h += '<div class="miss">還要：' + miss.join("、") + '</div>';

    // 今天已記錄
    var today = dayKey(Date.now());
    var tm = all.list.filter(function (x) { return dayKey(x.m.t) === today; }).sort(function (a, b) { return b.m.t - a.m.t; });
    if (tm.length) {
      h += '<section class="card"><h2>今天已記錄</h2>' +
        '<button class="btn block" data-act="saveImg" data-k="' + today + '">一鍵保存今日圖片</button>' +
        '<div class="hint">最後一餐記完後按這裡，會把今天每餐的食欲和吃的量做成一張圖。熱量和水份依罐頭標示估算，不含備用區。</div>' + nutriBox(tm) + previewHtml(today) + '<div class="mini">';
      tm.forEach(function (x) {
        h += '<button class="it" data-act="edit" data-id="' + esc(x.m.id) + '" aria-label="編輯第' + x.n + '餐"><span class="badge num" style="--sc:var(--s' + x.m.score + ')">' + x.m.score + '</span><div class="tx">第' + x.n + '餐 ・ ' + hm(x.m.t) + ' ・ ' + scoreFull(x.m.score) + '<span>' + esc(partsLabel(x.parts)) + ' ・ 吃 ' + x.m.eaten + 'g ・ ' + fmtN(mealNut(x).eatKcal) + ' 大卡</span></div><span class="chev">編輯 ›</span></button>';
      });

  }

  function mealCard(x) {
    var m = x.m, pct = m.offered ? Math.round(m.eaten / m.offered * 100) : 0, mn = mealNut(x);
    var h = '<article class="meal"><div class="l1"><span class="badge num" style="--sc:var(--s' + m.score + ')" title="' + scoreFull(m.score) + '">' + m.score + '</span>' +
      '<div class="ttl"><b>第' + x.n + '餐 ・ ' + scoreFull(m.score) + '</b><span>' + esc(partsLabel(x.parts)) + '</span></div><span class="tm" title="用餐時間">' + hm(m.t) + '</span></div>' +
      '<div class="row"><span class="pill">吃 <b class="num">' + m.eaten + '</b> / ' + m.offered + ' g（' + pct + '%）</span><span class="pill">熱量 <b class="num">' + fmtN(mn.eatKcal) + '</b> 大卡</span><span class="pill">水份 <b class="num">' + fmtN(mn.eatWater) + '</b> g</span></div>';
    var tags = (m.extras || []).map(function (k) { return '<span class="t2">' + esc(labelOf(EXTRAS, k)) + '</span>'; }).concat((m.symptoms || []).map(function (k) { return '<span class="t2 warn">' + esc(labelOf(SYMPTOMS, k)) + '</span>'; }));
    if (tags.length) h += '<div class="tagrow">' + tags.join("") + '</div>';
    if (m.note) h += '<div class="note">' + esc(m.note) + '</div>';
    var armed = armedDel === m.id;
    h += '<div class="acts"><button class="btn ghost small" data-act="edit" data-id="' + esc(m.id) + '">編輯</button>' +
      (armed ? '<button class="btn danger small" data-act="delGo" data-id="' + esc(m.id) + '">確定刪除</button><button class="btn ghost small" data-act="delCancel">不刪</button>' : '<button class="btn ghost small" data-act="delArm" data-id="' + esc(m.id) + '">刪除</button>') + '</div></article>';
    return h;
  }

  function logTab(all) {
    var h = "";
    if (!all.list.length) {
      return '<section class="card"><div class="empty">' + wikuFull(3) + '<b>還沒有紀錄</b><span>到「今天」記下 WIKU 的第一餐，這裡就會出現每天的紀錄。</span></div></section>';
    }
    var days = {}, order = [];
    all.list.slice().sort(function (a, b) { return b.m.t - a.m.t; }).forEach(function (x) {
      var k = dayKey(x.m.t);
      if (!days[k]) { days[k] = []; order.push(k); }
      days[k].push(x);
    });
    var todayK = dayKey(Date.now()), recentDays = order.slice(0, 7).reverse();
    h += '<section class="card"><div class="row between"><h2>最近 ' + recentDays.length + ' 天</h2><span class="hint">每根是一餐的食欲</span></div><div class="trend" role="img" aria-label="最近幾天每餐的食欲分數和當天吃進的熱量">';
    recentDays.forEach(function (k) {
      var items = days[k].slice().sort(function (a, b) { return a.m.t - b.m.t; }), d = new Date(items[0].m.t);
      h += '<div class="d' + (k === todayK ? " today" : "") + '"><span class="kc num">' + fmtN(dayNut(items).eatKcal) + '</span><div class="bars">';
      items.forEach(function (x) { h += '<i style="--sc:var(--s' + x.m.score + ');height:' + Math.max(8, x.m.score / 4 * 100) + '%" title="第' + x.n + '餐 ' + x.m.score + '分"></i>'; });
      h += '</div><span class="dl">' + (d.getMonth() + 1) + '/' + d.getDate() + '</span></div>';
    });
    h += '</div><div class="row between"><span class="hint">上面的數字是當天吃進的大卡</span><button class="btn ghost small" data-act="copyAll">複製近 7 天回報</button></div>';
    if (openCopy && openCopy.scope === "all") h += copyBox();
    h += '</section>';
    order.forEach(function (k) {
      var items = days[k], a = avg(items.map(function (x) { return x.m.score; }));
      h += '<section class="card day"><div class="dayh"><div><h3>' + dayLabel(items[0].m.t) + '</h3><div class="meta">' + items.length + ' 餐 ・ 平均 ' + fmt1(a) + ' 分</div></div><div class="row"><button class="btn small" data-act="saveImg" data-k="' + k + '">存成圖片</button><button class="btn ghost small" data-act="copyDay" data-k="' + k + '">複製回報</button></div></div>';
      h += nutriBox(items);
      h += previewHtml(k);
      if (openCopy && openCopy.scope === k) h += copyBox();
      items.forEach(function (x) { h += mealCard(x); });
      h += '</section>';
    });
    return h;
  }
  function copyBox() {
    return '<div class="field"><span class="hint">請長按全選後複製：</span><textarea id="copybox" class="copybox" readonly rows="6">' + esc(openCopy.text) + '</textarea></div>';
  }

  function cansTab(all) {
    var st = all.st, curIdx = st.left ? st.left.can - 1 : (st.next % 7);

    var nextOpen = st.next % 7;
    var round = Math.floor(st.next / 7) + 1;
    var scores = {}, usedC = [0, 0, 0, 0, 0, 0, 0];
    all.list.forEach(function (x) { x.parts.forEach(function (p) { if (p.src === "open") usedC[p.can - 1]++; (scores[p.can] = scores[p.can] || []).push(x.m.score); }); });
    var h = '<section class="card"><div class="row between"><h2>吃的順序</h2><span class="pill ok">第 <b class="num">' + round + '</b> 輪</span></div>' +

        '<label class="gw"><input class="num" id="size' + i + '" type="number" inputmode="numeric" min="1" max="400" data-size="' + i + '"' + (isLocked() ? " disabled" : "") + ' value="' + settings.sizes[i] + '" aria-label="' + c.n + '號每' + c.kind + '重量（克）"><span class="hint">g</span></label></div>';
    });
    if (isLocked()) h += '<div class="lockbar"><span>' + LOCK_SVG + ' 只能看：克數、庫存、熱量要有編輯金鑰才能改</span><button class="btn small" data-act="unlock">輸入金鑰</button></div>';
    h += '<div class="hint">右邊的克數是每罐／每包的重量，庫存是單據上的數量，開一罐就扣 1，都可以直接改。熱量和水分都是照包裝標示，點「熱量、水分」展開，可照包裝修改。</div></section>';

    h += '<section class="card"><h2>備用區</h2><div class="back">' +
      '<div class="b"><b>悅緻主食凍乾-鮮魚+羊</b><span>凍乾主要當作誘食，依吃的情況判斷怎麼用</span></div>' +
      '<div class="b"><b>OKAT主食凍乾-鮪+雞</b><span>誘食用，記錄時點「OKAT凍乾」</span></div>' +
      '<div class="b"><b>安森好肉 三種好肉</b><span>備用，視吃的情況使用</span></div>' +
      '<div class="b"><b>美喵人生 消化健康（顆）</b><span>轉食或換季拉吐時輔助消化。轉食順利沒用到的話，之後可當保養，一天一顆打開拌在食物內。</span></div></div></section>';

    h += '<section class="card"><details class="rules"><summary>餵食規則</summary><ol>' +
      '<li>食物不用額外加水。</li>' +

      '<li>每個口味開一罐吃完後，換開下一個。1～7 號依序吃，吃完 7 號是第一輪，第二輪從 1 號開始。每罐依序切成份量用完，例如 90g 就是 50g + 40g。</li>' +
      '<li>如果連續 2～3 餐都吃完，份量可以 +5g（55g），再 2～3 餐吃完再 +5g（60g）。沒吃完就遞減。</li>' +
      '<li>初期 7～14 天，每餐記錄食欲分數和吃的量，遇到不愛吃的也要記。</li></ol>' +

    h += '<section class="card"><h2>編輯金鑰</h2>';
    if (isLocked()) {
      h += '<div class="lockbar"><span>' + LOCK_SVG + ' 這支手機只能看不能改</span><button class="btn small" data-act="unlock">輸入金鑰</button></div>' +

        '<div class="row"><button class="btn small" data-act="keyRemove">移除金鑰</button><button class="btn ghost small" data-act="keyCancel">取消</button></div>';
    } else {

      '<div class="row"><button class="btn ghost small" data-act="export">匯出備份</button><label class="btn ghost small filebtn' + (isLocked() ? " off" : "") + '">匯入備份<input type="file" id="importFile"' + (isLocked() ? " disabled" : "") + ' accept=".json,application/json" aria-label="選擇備份檔"></label></div>';
    if (openCopy && openCopy.scope === "backup") h += '<div class="field"><span class="hint">無法直接存檔，請長按全選後複製，貼到記事本留著：</span><textarea id="copybox" class="copybox" readonly rows="6">' + esc(openCopy.text) + '</textarea></div>';

      (lastSync ? "最後同步 " + hm(lastSync) + "。" : "") + ((syncErr === "offline" || syncErr === "net") ? "現在連不上網路，恢復後會自動上傳。" : "") +
      '</div><div class="row"><button class="btn ghost small" data-act="syncNow">立即同步</button></div></section>';

  function render() {
    var all = computeAll();
    if (!draft) draft = newDraft();
    if (!draft.id && !draft.offTouched) draft.offered = settings.portion;
    var body = headerHtml(all) + (tab === "today" ? todayTab(all) : tab === "log" ? logTab(all) : cansTab(all));
    var app = document.getElementById("app");
    app.innerHTML = body;
    Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function (b) {
      if (b.getAttribute("data-v") === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (openCopy) { var cb = document.getElementById("copybox"); if (cb) { cb.focus(); cb.select(); } }
    if (tourOn) tourPlace(false);
  }

  /* ---------- 教學導覽 ---------- */
  var TOUR = [
    { tab: "today", t: null, x: "嗨，我是 WIKU！我帶你快速看一遍，怎麼記錄我吃飯。", m: 4 },
    { tab: "today", t: ".planhead", x: "這裡會告訴你下一餐要吃哪一罐、挖幾克。剩下的要另外冰起來，下一餐先吃它。" },
    { tab: "today", t: ".stepper", x: "份量預設 50g，可以按 ±5 或 ±1 調整。連續吃完會建議加 5g，沒吃完就建議減。" },
    { tab: "today", t: ".scores", x: "吃完後幫我打食欲分數：4 喜歡吃、3 吃剩1~2口、2 吃一半、1 只吃1~2口、0 完全不愛。" },
    { tab: "today", t: "#eaten", up: ".field", x: "填我實際吃了幾克，也可以按「全吃完」「一半」「沒吃」。" },
    { tab: "today", t: ".chips", up: ".field", x: "有用凍乾、安森好肉或益生菌，或我有嘔吐、拉肚子，就點起來。其他事寫在備註。" },
    { tab: "today", t: "[data-act=save]", x: "都填好後按這裡存起來，熱量和水份會自動算好。" },
    { tab: "today", t: "[data-act=saveImg]", x: "一天最後一餐記完，按這個鍵，把今天的吃飯狀況存成圖片，裡面有整天的熱量和水份。" },
    { tab: "log", t: null, demo: true, x: "這是範例。「紀錄」會整理每天的餐點，按「存成圖片」就會做出上面這樣的圖。" },
    { tab: "cans", t: "nav.tabs button[data-v=cans]", x: "「罐罐」可以看吃的順序、庫存，還有每罐的克數、熱量和水分，數字都能改。" },
    { tab: "today", t: null, x: "這樣就學會了！想再看一次，按最上面的「教學」。", m: 4 }
  ];
  var TOUR_FX = '<svg class="tb-rays" viewBox="0 0 100 30" aria-hidden="true"><g stroke="#F2B84B" stroke-width="4.5" stroke-linecap="round"><path d="M30 24 L22 12"/><path d="M50 18 L50 4"/><path d="M70 24 L78 12"/></g></svg><svg class="tb-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1 Q14 10 23 12 Q14 14 12 23 Q10 14 1 12 Q10 10 12 1Z" fill="#F6C453" stroke="#9A7769" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  var tourOn = false, tourI = 0, demoUrl = null;
  function demoItems() {
    var d = new Date(); d.setHours(8, 30, 0, 0); var t0 = d.getTime(), H = 3600000;
    function mk(n, dt, offered, eaten, score, extras, parts) { return { n: n, parts: parts, m: { id: "demo" + n, t: t0 + dt * H, offered: offered, eaten: eaten, score: score, extras: extras, symptoms: [], note: "" } }; }
    return [
      mk(1, 0, 50, 50, 4, [], [{ can: 1, g: 50, src: "open", round: 1, rem: 40 }]),
      mk(2, 4.5, 50, 40, 3, ["yz"], [{ can: 1, g: 40, src: "fridge", round: 1 }, { can: 2, g: 10, src: "open", round: 1, rem: 70 }]),
      mk(3, 10, 50, 25, 2, [], [{ can: 2, g: 50, src: "fridge", round: 1 }]),
      mk(4, 13.5, 50, 50, 4, ["probiotic"], [{ can: 2, g: 20, src: "fridge", round: 1 }, { can: 3, g: 30, src: "open", round: 1, rem: 60 }])
    ];
  }
  function demoHtml(items) {
    return '<div class="demo-tag">範例，不是真的紀錄</div><div class="hint">按「存成圖片」會變成這樣：</div><img id="demoImg" class="dayimg" alt="範例：一天吃飯狀況圖片">';
  }
  function showDemo(on) {
    var p = document.getElementById("tourDemo");
    if (!on) { p.style.display = "none"; return; }
    var items = demoItems();
    p.innerHTML = demoHtml(items); p.style.display = "flex"; p.scrollTop = 0;
    var put = function () { var im = document.getElementById("demoImg"); if (im && demoUrl) im.src = demoUrl; };
    if (demoUrl) { put(); return; }
    dayImage("demo", items).then(function (blob) { if (blob) { demoUrl = URL.createObjectURL(blob); put(); } }).catch(function () { /* image is optional */ });
  }
  function tourEl() {
    var st = TOUR[tourI], el = st.t ? document.querySelector(st.t) : null;
    if (el && st.up) el = el.closest(st.up);
    return el;
  }
  function tourPlace(scroll) {
    var root = document.getElementById("tour"), spot = document.getElementById("tourSpot"), el = tourEl();
    root.className = "on" + (el ? "" : " dim");
    if (!el) { spot.style.display = "none"; return; }
    var r = el.getBoundingClientRect();
    if (scroll && !el.closest("nav")) { window.scrollTo(0, Math.max(0, window.pageYOffset + r.top - 110)); r = el.getBoundingClientRect(); }
    spot.style.display = "block";
    spot.style.left = (r.left - 6) + "px"; spot.style.top = (r.top - 6) + "px";
    spot.style.width = (r.width + 12) + "px"; spot.style.height = (r.height + 12) + "px";
  }
  function tourShow() {
    var st = TOUR[tourI];
    if (st.tab !== tab) { tab = st.tab; render(); }
    var last = tourI === TOUR.length - 1;
    document.getElementById("tourBox").innerHTML = '<div class="tb-cat"><div class="tb-hop">' + wikuImg("hop", "cat") + TOUR_FX + '</div></div><div class="tb-main"><div class="tb-text">' + esc(st.x) + '</div><div class="tb-row"><span class="tb-step num">' + (tourI + 1) + ' / ' + TOUR.length + '</span><span class="tb-btns">' +
      (last ? "" : '<button class="btn ghost small" data-tour="skip">跳過</button>') + (tourI > 0 ? '<button class="btn ghost small" data-tour="prev">上一步</button>' : "") +
      '<button class="btn small" data-tour="next">' + (last ? "開始使用" : "下一步") + '</button></span></div></div>';
    showDemo(!!st.demo);
    tourPlace(true);
  }
  function startTour() { tourOn = true; tourI = 0; tab = "today"; render(); window.scrollTo(0, 0); tourShow(); }
  function endTour() {
    tourOn = false; document.getElementById("tour").className = ""; showDemo(false);
    lsSet("wiku.tour", "1"); tab = "today"; render(); window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-tour]");
    if (!b) return;
    var a = b.getAttribute("data-tour");
    if (a === "skip") { endTour(); return; }
    if (a === "prev") { tourI = Math.max(0, tourI - 1); tourShow(); return; }
    if (tourI >= TOUR.length - 1) { endTour(); return; }
    tourI++; tourShow();
  });
  window.addEventListener("resize", function () { if (tourOn) tourPlace(false); });

  /* ---------- 啟動 ---------- */
  loadLocal();
  loadKey();
  loadQueue();
  render();
  sync();
  setInterval(function () {
    if (syncing || document.visibilityState !== "visible") return;
    if (queue.length && syncErr !== "badkey" && syncErr !== "noperm") sync();
    else if (Date.now() - lastSync > 90000) sync();
  }, 20000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && Date.now() - lastSync > 15000) sync(); });
  window.addEventListener("online", function () { sync(); });

  lsSet("wiku.t", "1");
  if (lsGet("wiku.t") === "1" && lsGet("wiku.tour") !== "1") setTimeout(startTour, 700);
})();
</script>
</body>
</html>
